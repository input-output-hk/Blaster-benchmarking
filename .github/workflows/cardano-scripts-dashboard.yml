name: Cardano Scripts dashboard

on:
  pull_request:
    paths:
      - 'LiveScripts/**'
      - 'cardano-dashboard/**'
      - '.github/workflows/cardano-scripts-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'LiveScripts/**'
      - 'cardano-dashboard/**'
      - '.github/workflows/cardano-scripts-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check corpus import and dashboard source
        run: |
          python3 -m unittest discover -s LiveScripts -p 'test_*.py'
          python3 -m py_compile LiveScripts/import_corpus.py LiveScripts/benchmark.py cardano-dashboard/build.py
          node --check cardano-dashboard/app.js
      - name: Build public dashboard
        run: python3 cardano-dashboard/build.py
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cardano-dashboard/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
